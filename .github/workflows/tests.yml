# Runs Lag Effect's tests (tests/run.sh) on Linux on every push and pull request: the Mixer gate, the vocoder's Synth plugin
# style (with a fake synth), the Soundboard's looper and beatbox drums, Mic > Speech's
# recognizer feed / bleeps / muting, Whisper on a real recording (with whisper.cpp and its models), extra outputs not
# running dry, short device names, the Recorder, and "default settings sound bit-for-bit the same as main".
# A commit meant to change the sound says so with [audio-change] in its message (that one check then only reports).
name: Tests

on:
  push:
    branches-ignore: [build-output]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get main's LagEffect.cpp (to compare the sound with)
        run: |
          git fetch --depth 1 origin main
          git show FETCH_HEAD:LagEffect.cpp > "$RUNNER_TEMP/main.cpp"

      # Speech (Mic > Speech, 1.58.0): whisper.cpp, built the way the exe has it, and its models, checked against the
      # SHA-1s in LagEffect.cpp (the app refuses a model that doesn't match, so a wrong one there would break downloads).
      - name: Get whisper.cpp v1.9.5 and build it
        run: |
          git clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF > /dev/null
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" -j 4 --target whisper > /dev/null

      - name: Download the speech models and check them
        run: |
          for f in ggml-tiny.en-q5_1.bin ggml-base.en-q5_1.bin ggml-small.en-q5_1.bin; do
            curl -sSfL -o "$RUNNER_TEMP/$f" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$f"
            want=$(grep -o "\"$f\", *\"[0-9a-f]*\"" LagEffect.cpp | grep -o "[0-9a-f]\{40\}")
            got=$(sha1sum "$RUNNER_TEMP/$f" | cut -d' ' -f1)
            echo "$f: LagEffect.cpp has $want, the file is $got"; [ "$want" = "$got" ]
          done

      # Laughing / coughing / breathing (ESC-50, CC BY-NC 3.0, test use only): Whisper mustn't make up words from them
      - name: Download sounds that aren't speech
        run: |
          mkdir -p "$RUNNER_TEMP/esc"
          for f in 1-1791-A-26 1-30039-A-26 1-30043-A-26 1-33658-A-26 1-36164-A-26 1-72695-A-26 1-73123-A-26 2-109759-A-26 2-60791-A-26 \
                   1-19111-A-24 1-52266-A-24 1-18631-A-23 1-36393-A-23; do
            curl -sSfL -o "$RUNNER_TEMP/esc/$f.wav" "https://raw.githubusercontent.com/karolpiczak/ESC-50/master/audio/$f.wav"
          done
          ls "$RUNNER_TEMP/esc" | wc -l

      # (1.68.0) the phone remote's page, run in jsdom against a fake Lag Effect
      - name: Get jsdom
        run: npm install --silent --prefix "$RUNNER_TEMP/js" jsdom@24

      - name: Run the tests
        env:
          NODE_PATH: ${{ runner.temp }}/js/node_modules
          WHISPER_DIR: ${{ runner.temp }}/whisper.cpp
          WHISPER_MODELS: ${{ runner.temp }}/ggml-tiny.en-q5_1.bin ${{ runner.temp }}/ggml-base.en-q5_1.bin
          NOISE_DIR: ${{ runner.temp }}/esc
          MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          case "$MSG" in *"[audio-change]"*) export AUDIO_CHANGE=1 ;; esac
          export NOISE_CLIPS="$(ls "$NOISE_DIR"/*.wav | tr '\n' ' ')"
          bash tests/run.sh "$RUNNER_TEMP/main.cpp"
