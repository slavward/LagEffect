# Builds LagEffect.exe on GitHub's Windows machines.
# Runs on every push to a branch other than build-output, and can be started by hand from the Actions tab.
# The exe is kept as a downloadable artifact and also committed to the "build-output" branch
# (build-output/<branch>/LagEffect.exe) so it can be fetched with plain git.
name: Build

on:
  push:
    branches-ignore: [build-output]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get miniaudio 0.11.25
        shell: bash
        run: git clone --depth 1 --branch 0.11.25 https://github.com/mackron/miniaudio _miniaudio && cp _miniaudio/miniaudio.h .

      # Plugins (Mic > Plugins): only the VST3 interface headers (MIT licence), none of the SDK's libraries.
      - name: Get the VST3 interface headers 3.8.1
        shell: bash
        run: git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3_pluginterfaces vst3/pluginterfaces

      # ...and the CLAP headers (MIT licence) for .clap plugins.
      - name: Get the CLAP headers 1.2.9
        shell: bash
        run: git clone --depth 1 --branch 1.2.9 https://github.com/free-audio/clap clap

      # Phone remote (1.68.0): Nayuki's QR Code generator (MIT licence), C version, for the pairing code.
      - name: Get QR Code generator 1.8.0
        shell: bash
        run: git clone -q --depth 1 --branch v1.8.0 https://github.com/nayuki/QR-Code-generator qrcodegen

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Speech (Mic > Speech, 1.58.0): whisper.cpp (MIT licence), built as static libraries into the exe. Its CPU code
      # uses AVX2 (the app checks for it before starting the engine); the rest of the exe is built as before.
      - name: Get whisper.cpp v1.9.5 and build it
        shell: pwsh
        run: |
          git clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp whisper.cpp
          cmake -S whisper.cpp -B wb -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF `
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded *> wb.log
          if ($LASTEXITCODE) { Get-Content wb.log; exit 1 }
          cmake --build wb --config Release --target whisper -j 4 *>> wb.log
          if ($LASTEXITCODE) { Get-Content wb.log -Tail 80; exit 1 }
          $libs = Get-ChildItem wb -Recurse -Include whisper.lib, ggml.lib, ggml-base.lib, ggml-cpu.lib
          $libs | ForEach-Object { $_.FullName }
          if ($libs.Count -lt 4) { Get-Content wb.log -Tail 80; throw "whisper.cpp libraries missing" }
          ($libs | ForEach-Object { '"' + $_.FullName + '"' }) -join ' ' | Out-File -Encoding ascii -NoNewline wlibs.txt

      # RNNoise 0.2 (1.60.0, Mic > Noise suppression's "New" model): its release, checked against its SHA-256. Built with
      # every name prefixed rn2_ (rnnoise2/names.h) so it links next to 0.1.1, with its own run-time pick of SSE4.1 / AVX2.
      - name: Get RNNoise 0.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/xiph/rnnoise/releases/download/v0.2/rnnoise-0.2.tar.gz -OutFile rn2.tgz
          $h = (Get-FileHash rn2.tgz -Algorithm SHA256).Hash
          if ($h -ne "90FCE4B00B9FF24C08DBFE31B82FFD43BAE383D85C5535676D28B0A2B11C0D37") { throw "RNNoise 0.2: wrong SHA-256 $h" }
          tar -xzf rn2.tgz -C rnnoise2

      # VB-CABLE: VB-Audio's own driver package, unchanged, inside the exe (LagEffect.rc, RCDATA 2), so "Use
      # VB-Cable" can install it. VB-Audio allows bundling the standard VB-CABLE unchanged (vb-audio.com/Services/licensing.htm;
      # not A+B / C+D). Its setup program must carry a valid Authenticode signature from VB-Audio, checked here and again by
      # the app before it runs it.
      - name: Get VB-CABLE (VBCABLE_Driver_Pack45)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile vbcable.zip
          "VBCABLE_Driver_Pack45.zip SHA-256: " + (Get-FileHash vbcable.zip -Algorithm SHA256).Hash
          Expand-Archive vbcable.zip -DestinationPath _vbc
          Get-ChildItem _vbc -Recurse | ForEach-Object { $_.FullName.Substring((Resolve-Path _vbc).Path.Length) + "  " + $_.Length }
          $setup = Get-ChildItem _vbc -Recurse -Filter VBCABLE_Setup_x64.exe | Select-Object -First 1
          if (-not $setup) { throw "VB-CABLE: no VBCABLE_Setup_x64.exe in the package" }
          $sig = Get-AuthenticodeSignature $setup.FullName
          "Signature: " + $sig.Status + "  " + $sig.SignerCertificate.Subject
          if ($sig.Status -ne "Valid") { throw "VB-CABLE: the setup program's signature isn't valid" }
          if ($sig.SignerCertificate.Subject -notmatch "Burel|VB-Audio") { throw "VB-CABLE: signed by someone else" }
          if ((Get-Item vbcable.zip).Length -gt 4MB) { throw "VB-CABLE: the package is bigger than expected" }

      - name: Compile
        shell: cmd
        run: |
          set /p WLIBS=<wlibs.txt
          set RN=rnnoise\src\denoise.c rnnoise\src\rnn.c rnnoise\src\rnn_data.c rnnoise\src\pitch.c rnnoise\src\kiss_fft.c rnnoise\src\celt_lpc.c
          set R2=rnnoise2\rnnoise-0.2\src
          set D2=/nologo /c /O2 /MT /W0 /DRNN_ENABLE_X86_RTCD /D__SSE2__ /FI "%CD%\rnnoise2\names.h" /I rnnoise2\rnnoise-0.2\include /I %R2% /Forn2\
          mkdir rn2
          cl %D2% %R2%\denoise.c %R2%\rnn.c %R2%\rnnoise_data.c %R2%\rnnoise_tables.c %R2%\pitch.c %R2%\kiss_fft.c %R2%\celt_lpc.c %R2%\nnet.c %R2%\nnet_default.c %R2%\parse_lpcnet_weights.c %R2%\x86\x86cpu.c %R2%\x86\x86_dnn_map.c > build.log 2>&1 || (type build.log & exit /b 1)
          cl %D2% /D__SSSE3__ /D__SSE4_1__ %R2%\x86\nnet_sse4_1.c >> build.log 2>&1 || (type build.log & exit /b 1)
          cl %D2% /arch:AVX2 %R2%\x86\nnet_avx2.c >> build.log 2>&1 || (type build.log & exit /b 1)
          rc /nologo LagEffect.rc >> build.log 2>&1 || (type build.log & exit /b 1)
          cl /nologo /O2 /MT /utf-8 /EHsc /W3 /D_USE_MATH_DEFINES /I rnnoise\include /I vst3 /I clap\include /I whisper.cpp\include /I whisper.cpp\ggml\include /I qrcodegen\c LagEffect.cpp qrcodegen\c\qrcodegen.c %RN% rn2\*.obj LagEffect.res %WLIBS% /link /SUBSYSTEM:WINDOWS /OUT:LagEffect.exe >> build.log 2>&1 || (type build.log & exit /b 1)
          type build.log

      - name: Check the exe
        shell: pwsh
        run: |
          $f = Get-Item LagEffect.exe
          "Built $($f.Name): $($f.Length) bytes"
          "SHA-256: $((Get-FileHash LagEffect.exe -Algorithm SHA256).Hash)"
          if ($f.Length -lt 100000) { throw "exe is suspiciously small" }

      - uses: actions/upload-artifact@v4
        with:
          name: LagEffect-${{ github.ref_name }}
          path: LagEffect.exe

      - name: Save to build-output branch
        shell: bash
        run: |
          set -e
          ref="${GITHUB_REF_NAME//\//-}"
          sha="$(git rev-parse --short HEAD)"
          cp LagEffect.exe "$RUNNER_TEMP/LagEffect.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin build-output >/dev/null 2>&1; then
            git fetch --depth 1 origin build-output
            git checkout -f -B build-output FETCH_HEAD
          else
            git checkout -f --orphan build-output
            git rm -rfq . || true
          fi
          git clean -fdxq
          mkdir -p "$ref"
          cp "$RUNNER_TEMP/LagEffect.exe" "$ref/LagEffect.exe"
          echo "$sha" > "$ref/SOURCE_COMMIT"
          git add "$ref"
          git commit -qm "Build $ref @ $sha"
          git push origin build-output

      # If the build fails, save the compiler output where it can be read with plain git.
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          cp build.log "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no build.log" > "$RUNNER_TEMP/build.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin build-output && git checkout -f -B build-output FETCH_HEAD
          git clean -fdxq
          mkdir -p "$ref"
          cp "$RUNNER_TEMP/build.log" "$ref/build-failed.log"
          git add "$ref" && git commit -qm "Failed build log $ref" && git push origin build-output
